<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cedric Turner II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --ink: #171717;
    --muted: #73736e;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html { background: var(--paper); color: var(--ink); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }

  .page {
    width: min(1040px, calc(100% - 56px));
    margin: 0 auto;
    padding: 54px 0 100px;
  }

  .site-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 28px;
  }

  .identity {
    display: flex;
    align-items: baseline;
    gap: 16px;
    font-size: 11px;
  }

  .name { font-weight: 500; }
  .work-link {
    color: var(--muted);
    text-decoration: none;
  }
  .work-link:hover,
  .work-link:focus-visible {
    color: var(--ink);
    outline: 1px solid var(--ink);
    outline-offset: 4px;
  }

  .desk {
    position: relative;
    min-height: 720px;
    margin-top: 96px;
  }

  .desk-item {
    position: absolute;
    display: flex;
    align-items: center;
    min-height: 92px;
    padding: 20px 24px;
    color: var(--ink);
    background: var(--paper);
    border: 1.5px solid currentColor;
    font-size: clamp(16px, 1.8vw, 19px);
    font-weight: 500;
    line-height: 1.25;
    text-decoration: none;
    transition: color 120ms ease, background-color 120ms ease;
  }

  .desk-item:hover,
  .desk-item:focus-visible {
    color: var(--paper);
    background: var(--ink);
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .desk-item--one {
    width: 31%;
    top: 12px;
    left: 3%;
    border-radius: 48% 4px 45% 3px / 10% 45% 8% 42%;
    transform: rotate(-.7deg);
  }

  .desk-item--two {
    width: 33%;
    top: 70px;
    right: 7%;
    border-radius: 4px 47% 5px 40% / 43% 7% 38% 8%;
    transform: rotate(.6deg);
  }

  .desk-item--three {
    width: 30%;
    top: 300px;
    left: 34%;
    border-radius: 6% 44% 4% 46% / 39% 8% 41% 7%;
    transform: rotate(.4deg);
  }

  @media (max-width: 720px) {
    .page {
      width: min(100% - 36px, 1040px);
      padding: 34px 0 70px;
    }

    .identity {
      display: block;
    }

    .work-link {
      display: block;
      width: fit-content;
      margin-top: 7px;
    }

    .desk {
      min-height: 0;
      margin-top: 74px;
    }

    .desk-item {
      position: relative;
      width: 88%;
      min-height: 76px;
      inset: auto;
      margin: 0 0 28px;
      font-size: 16px;
    }

    .desk-item:nth-child(even) {
      margin-left: auto;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .desk-item { transition-duration: .01ms; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="identity">
      <span class="name">Cedric Turner II</span>
      <a class="work-link" href="./work/">work →</a>
    </div>
    <!-- The language picker is added in Task 4. -->
  </header>

  <main class="desk" aria-label="Personal writing">
    <a class="desk-item desk-item--one" href="./blog/27/">who is cedric?</a>
    <a class="desk-item desk-item--two" href="./blog/ai-forces-preference/">ai forces preference</a>
    <a class="desk-item desk-item--three" href="./where-ive-been/">where i've been</a>
  </main>
</div>
</body>
</html>
